services:
  qulf:
    build: .
    container_name: qulf-crm
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # Baza fayli host da qoladi - konteyner qayta qurilsa ham kartalar joyida
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
